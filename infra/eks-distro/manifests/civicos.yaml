# CivicOS — EKS Distro Kubernetes Manifests
# These target the exact Kubernetes distribution AWS ships inside EKS
# Works both on cloud EKS and local EKS Distro clusters

---
apiVersion: v1
kind: Namespace
metadata:
  name: civicos
  labels:
    app: civicos

---
# Orchestrator Deployment (FastAPI + Strands Agents)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  namespace: civicos
  labels:
    app: civicos
    component: orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: civicos
      component: orchestrator
  template:
    metadata:
      labels:
        app: civicos
        component: orchestrator
    spec:
      containers:
        - name: orchestrator
          image: civicos/orchestrator:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: civicos-config
            - secretRef:
                name: civicos-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  namespace: civicos
spec:
  selector:
    app: civicos
    component: orchestrator
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
# Eligibility Engine Deployment (Python, deterministic)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eligibility-engine
  namespace: civicos
  labels:
    app: civicos
    component: eligibility-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: civicos
      component: eligibility-engine
  template:
    metadata:
      labels:
        app: civicos
        component: eligibility-engine
    spec:
      containers:
        - name: eligibility-engine
          image: civicos/eligibility-engine:latest
          ports:
            - containerPort: 8081
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: eligibility-engine
  namespace: civicos
spec:
  selector:
    app: civicos
    component: eligibility-engine
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP

---
# Frontend Deployment (React + Vite)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: civicos
  labels:
    app: civicos
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: civicos
      component: frontend
  template:
    metadata:
      labels:
        app: civicos
        component: frontend
    spec:
      containers:
        - name: frontend
          image: civicos/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: civicos
spec:
  selector:
    app: civicos
    component: frontend
  ports:
    - port: 80
      targetPort: 80
  type: LoadBalancer

---
# ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: civicos-config
  namespace: civicos
data:
  MODEL_PROVIDER: "ollama"
  OLLAMA_BASE_URL: "http://ollama:11434"
  OLLAMA_MODEL: "llama3.1"
  MONGODB_URI: "mongodb://mongodb:27017/civicos"
  OPENSEARCH_URL: "http://opensearch:9200"
  ELIGIBILITY_ENGINE_URL: "http://eligibility-engine:8081"
  CEDAR_POLICY_DIR: "/app/policies"
  DOCUMENT_SANDBOX_MODE: "stub"

---
# Secrets (placeholder — use real secret management in production)
apiVersion: v1
kind: Secret
metadata:
  name: civicos-secrets
  namespace: civicos
type: Opaque
stringData:
  TAVILY_API_KEY: ""
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
